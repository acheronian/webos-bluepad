[workspace]
resolver = "2"
members = [
    "crates/bluepad-core",
    "crates/bluepad-radio",
    "crates/bluepad-daemon",
    "crates/bluepad-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/acheronian/webos-bluepad"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bluepad-core = { path = "crates/bluepad-core" }
bluepad-radio = { path = "crates/bluepad-radio" }
